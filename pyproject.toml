[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-migrate"
version = "2.0.0"
description = "Download plugins online and install them offline"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
plugin-migrate = "plugin_migrate.cli:main"

[tool.setuptools.packages.find]
include = ["plugin_migrate*"]
